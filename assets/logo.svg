<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Source Control">
  <defs>
    <linearGradient id="trunkB4" x1="28" y1="16" x2="28" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="branchB4" x1="28" y1="36" x2="62" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <style>
    .trunk-edge { stroke-width: 9px; }
    .fork-edge { stroke-width: 8.5px; }
    .node-ring { r: 10.5px; stroke-width: 4.5px; }
    .small-only { display: none; }
    @media (max-width: 28px) {
      .detail-only { display: none; }
      .small-only { display: inline; }
      .trunk-edge { stroke-width: 12.5px; }
      .fork-edge { stroke-width: 11.5px; }
      .node-ring { r: 12.5px; stroke-width: 5.5px; }
    }
  </style>

  <!-- Left: Git Orange Trunk + Cyan Worktree Branch -->
  <path class="trunk-edge" d="M28 24V104" stroke="url(#trunkB4)" stroke-linecap="round"/>
  <path class="fork-edge" d="M28 44C46 44 62 56 62 76V92" stroke="url(#branchB4)" stroke-linecap="round"/>

  <!-- Commit Nodes -->
  <circle class="node-ring" cx="28" cy="24" fill="#0f172a" stroke="#fb923c"/>
  <circle class="node-ring" cx="28" cy="104" fill="#0f172a" stroke="#f97316"/>
  <circle class="node-ring" cx="62" cy="94" fill="#083344" stroke="#22d3ee"/>

  <!-- Right (Normal Size): Emerald +, Rose -, Amber ~ -->
  <g class="detail-only">
    <path d="M76 31H86M81 26V36" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <rect x="92" y="25" width="26" height="12" rx="6" fill="#10b981"/>
    <path d="M76 55H86" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
    <rect x="92" y="49" width="20" height="12" rx="6" fill="#f43f5e"/>
    <circle cx="81" cy="79" r="4.5" fill="#fbbf24"/>
    <rect x="92" y="73" width="24" height="12" rx="6" fill="#f59e0b"/>
  </g>

  <!-- Right (Small <=28px Mode) -->
  <g class="small-only">
    <rect x="76" y="24" width="40" height="18" rx="9" fill="#10b981"/>
    <rect x="76" y="52" width="32" height="18" rx="9" fill="#f43f5e"/>
  </g>
</svg>
