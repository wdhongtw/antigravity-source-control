<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Source Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <!-- Top Clickable Repository / Worktree Rows (File Explorer Registration Pattern) -->
      <div class="root-selector-box">
        <div class="root-selector-header">
          <span class="root-selector-label">
            Repositories &amp; Worktrees
            <span id="count-roots" class="badge-count">0</span>
          </span>
        </div>
        <div id="root-list" class="root-list" role="listbox" aria-label="Tracked Git repositories and worktrees"></div>
      </div>
    </header>

    <main id="vcs-body" class="vcs-body">
      <div id="empty-root-state" class="empty-state">
        Loading session Git repositories…
      </div>

      <div id="repo-workspace" class="repo-workspace hidden">
        <!-- IDE Source Control Changes & Commit Section -->
        <section class="scm-section" aria-label="Source Control Changes and Commit">
          <div class="scm-commit-box">
            <textarea
              id="commit-input"
              class="commit-input"
              rows="2"
              placeholder="Commit message (Ctrl+Enter to commit)"
            ></textarea>
            <div class="commit-controls">
              <label class="amend-toggle" title="Amend the previous commit (git commit --amend)">
                <input type="checkbox" id="chk-amend">
                <span>Amend</span>
              </label>
              <div class="commit-btns">
                <button id="btn-commit" type="button" class="ghost-btn primary">Commit</button>
              </div>
            </div>
          </div>

          <!-- Inline Confirmation Bar for Discard Actions -->
          <div id="mutation-bar" class="mutation-bar hidden" role="region" aria-label="Discard confirmation prompt"></div>

          <!-- Staged & Working Tree Changes Tree -->
          <div id="changes-lists" class="changes-lists"></div>
        </section>

        <!-- Unified Diff & Commit Stack Inspector Section -->
        <section class="diff-section" aria-label="Unified Diff and Commit Inspector">
          <div class="diff-header">
            <div class="diff-mode-bar">
              <div class="segmented diff-modes" role="tablist" aria-label="Diff mode">
                <button type="button" class="seg-btn active" data-mode="working" title="All uncommitted working tree, staged, and untracked changes">Working Tree</button>
                <button type="button" class="seg-btn" data-mode="staged" title="Staged index changes only (git diff --cached)">Staged</button>
                <button type="button" class="seg-btn" data-mode="unstaged" title="Unstaged working tree and untracked changes">Unstaged</button>
                <button type="button" class="seg-btn" data-mode="all" title="Committed + uncommitted changes compared to base branch">All vs Base</button>
                <button type="button" class="seg-btn" data-mode="branch" title="Committed changes on this branch or recent commit history">Commits</button>
              </div>
            </div>

            <div id="commits-box" class="commits-box hidden"></div>

            <div class="file-toolbar">
              <input id="file-filter" type="search" class="file-search" placeholder="Filter changed files…" autocomplete="off">
              <span id="diff-summary-stats" class="diff-summary-stats"></span>
              <div class="ctx-control" title="Surrounding diff context lines (git diff -U)">
                <button id="btn-ctx-shrink" type="button" class="ghost-btn sm" title="Shrink surrounding context lines">&#8722;</button>
                <span id="ctx-label" class="ctx-label">3 ctx</span>
                <button id="btn-ctx-expand" type="button" class="ghost-btn sm" title="Expand surrounding context lines">+</button>
              </div>
              <button id="btn-expand-all" type="button" class="ghost-btn sm">Expand All</button>
              <button id="btn-collapse-all" type="button" class="ghost-btn sm">Collapse All</button>
            </div>
          </div>

          <div id="diff-container" class="diff-container"></div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
